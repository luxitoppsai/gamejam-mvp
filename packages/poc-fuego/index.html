<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Verde Otra Vez - PoC 1: Simulación del fuego</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 13px/1.4 system-ui, sans-serif; }
      #app { display: flex; height: 100%; }
      #game { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
      #panel { width: 250px; padding: 10px; background: #1c1c20; overflow-y: auto; box-sizing: border-box; }
      #panel h1 { font-size: 14px; margin: 0 0 8px; color: #9be564; }
      #panel h2 { font-size: 11px; margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .06em; color: #888; }
      #panel .row { display: flex; flex-wrap: wrap; gap: 4px; }
      button { background: #2e2e36; color: #eee; border: 1px solid #44444f; border-radius: 4px; padding: 4px 8px; cursor: pointer; font: inherit; }
      button:hover { background: #3a3a45; }
      #stats { white-space: pre; font: 11px/1.5 ui-monospace, Consolas, monospace; background: #111; padding: 6px; border-radius: 4px; }
      #help { color: #999; font-size: 12px; }
      @media (max-width: 700px) { #app { flex-direction: column; } #panel { width: auto; max-height: 45%; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
      <aside id="panel">
        <h1>PoC 1 - Fuego</h1>
        <div id="stats"></div>
        <h2>Simulación</h2>
        <div class="row">
          <button id="btn-pause">Pausa</button>
          <button id="btn-speed">Velocidad x1</button>
          <button id="btn-restart">Reiniciar</button>
          <button id="btn-newseed">Nueva semilla</button>
          <button id="btn-size64">64x64</button>
          <button id="btn-size128">128x128</button>
        </div>
        <h2>Fuego</h2>
        <div class="row">
          <button id="btn-center">Encender centro</button>
          <button id="btn-many">Encender 8 focos</button>
        </div>
        <h2>Viento</h2>
        <div class="row">
          <button id="btn-windl">&#8634; -45&deg;</button>
          <button id="btn-windr">&#8635; +45&deg;</button>
          <button id="btn-winddown">Fuerza -</button>
          <button id="btn-windup">Fuerza +</button>
          <button id="btn-autowind">Auto-viento: no</button>
        </div>
        <h2>Cámara</h2>
        <div class="row"><button id="btn-zoom">Zoom</button></div>
        <p id="help">
          Clic: encender celda.<br />
          Clic derecho: apagar (radio 3).<br />
          WASD / flechas: mover cámara.<br />
          Rueda o Z: zoom. Espacio: pausa.<br />
          Viento: 0&deg; = este, 90&deg; = sur.
        </p>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
